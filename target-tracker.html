<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Tracker Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="target-tracker.css">
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-4xl w-full">
        <!-- Score Display -->
        <div class="bg-gray-800 rounded-lg shadow-lg p-3 mb-4">
            <div class="flex justify-between items-center flex-wrap gap-4">
                <div class="text-center">
                    <p class="text-xs text-gray-400">Round</p>
                    <p class="text-xl font-bold text-green-400" id="roundCounter">1</p>
                </div>
                <div class="text-center">
                    <p class="text-xs text-gray-400">Accuracy</p>
                    <p class="text-xl font-bold text-green-400" id="accuracyCounter">0%</p>
                </div>
                <div class="text-center">
                    <p class="text-xs text-gray-400">Difficulty</p>
                    <p class="text-xl font-bold text-green-400" id="difficultyDisplay">Level 1</p>
                </div>
                <div class="text-center">
                    <p class="text-xs text-gray-400">Streak</p>
                    <p class="text-xl font-bold text-green-400" id="streakCounter">0</p>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="bg-gray-800 rounded-lg shadow-lg p-6 text-center mb-4">
            <h1 class="text-3xl font-bold text-green-400 mb-3">Target Tracker</h1>
            <p class="text-base text-gray-300 mb-4">Track the highlighted circles as they move!</p>
            <p class="text-xs text-gray-400 mb-6 max-w-xl mx-auto">Watch which circles are highlighted, then click on them after they stop moving.</p>
            <button id="startBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg text-lg transition-all duration-200 shadow-md hover:shadow-lg">
                Start Game
            </button>
        </div>

        <!-- Game Area -->
        <div class="bg-gray-800 rounded-lg shadow-lg p-4 md:p-6 relative hidden" id="gameArea">
            <div class="relative w-full" style="min-height: 400px; max-height: 600px;" id="gameCanvas">
                <!-- Circles will be dynamically created here -->
            </div>

            <!-- Status Message -->
            <div class="mt-4 text-center">
                <p class="text-base font-semibold text-gray-300" id="statusMessage">Watch the highlighted circles...</p>
            </div>

            <!-- Round Result -->
            <div id="roundResult" class="hidden mt-4 text-center">
                <p class="text-lg font-bold mb-2" id="resultText"></p>
                <button id="nextRoundBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg text-sm transition-all duration-200 shadow-md hover:shadow-lg mt-2">
                    Next Round
                </button>
            </div>

            <!-- Restart Button -->
            <div class="mt-4 text-center">
                <button id="restartBtn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded-lg text-sm transition-all duration-200 shadow-md hover:shadow-lg">
                    Restart Game
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
            <div class="bg-gray-800 rounded-lg shadow-2xl p-8 max-w-md w-full mx-4 text-center">
                <h2 class="text-3xl font-bold text-green-400 mb-4">Game Over!</h2>
                <div class="mb-6">
                    <p class="text-lg text-gray-300 mb-2">Final Accuracy: <span class="font-bold text-green-400" id="finalAccuracy">0%</span></p>
                    <p class="text-lg text-gray-300">Total Rounds: <span class="font-bold text-green-400" id="finalRounds">0</span></p>
                </div>
                <button id="playAgainBtn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition-all duration-200 shadow-md hover:shadow-lg">
                    Play Again
                </button>
            </div>
        </div>
    </div>

    <script src="target-tracker.js"></script>
</body>
</html>
